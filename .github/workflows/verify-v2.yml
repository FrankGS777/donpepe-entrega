name: Verificar DonPepe V2

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:v2
      - run: npm run test:v2
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -f Dockerfile.v2 -t donpepe:verify .
