<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101114" />
    <meta name="description" content="DonPepe gestiona compras, inventario por lote y abastecimiento del centro de distribución a sus tiendas." />
    <title>DonPepe</title>
    <link rel="icon" href="/images/favicon-64.png" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/app-bundle.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a href="#overview" class="brand"
          ><img
            class="brand-logo"
            src="/images/donpepe-logo-ui-720.webp"
            alt="DonPepe"
            width="2117"
            height="743" /></a
        ><span class="sidebar-caption">OPERACIÓN CONECTADA</span>
        <nav id="navigation" aria-label="Navegación principal"></nav>
        <div class="sidebar-bottom">
          <button id="open-about" class="sidebar-about">
            Sobre esta versión <span>↗</span>
          </button>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <a
            href="#overview"
            class="workspace-brand"
            aria-label="DonPepe · inicio"
            ><img
              class="brand-logo"
              src="/images/donpepe-logo-ui-720.webp"
              alt="DonPepe"
              width="2117"
              height="743"
          /></a>
          <button
            class="icon-button mobile-menu"
            id="mobile-menu"
            aria-label="Abrir navegación"
          >
            ☰
          </button>
          <div class="breadcrumbs" hidden>
            <span id="breadcrumb">DONPEPE</span
            ><strong id="page-title">Centro de control</strong>
          </div>
          <nav
            id="workspace-nav"
            aria-label="Herramientas de operaciones"
          ></nav>
          <div class="topbar-right">
            <span
              class="connection-pill"
              id="connection"
              role="status"
              aria-live="polite"
              hidden
            ></span
            ><time id="sim-time"></time>
            <button
              type="button"
              class="theme-toggle icon-button"
              data-theme-toggle
              aria-label="Cambiar tema"
              title="Cambiar tema"
            >
              <svg
                class="theme-icon-light icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
                />
              </svg>
              <svg
                class="theme-icon-dark icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  d="M20.6 13.8A8.7 8.7 0 0 1 10.2 3.4 8.8 8.8 0 1 0 20.6 13.8Z"
                />
              </svg>
            </button>
            <button
              class="user-chip"
              id="user-menu"
              aria-expanded="false"
              aria-controls="account-menu"
              aria-labelledby="user-name user-role"
            >
              <span id="user-avatar" class="user-avatar" aria-hidden="true"
                >D</span
              ><span
                ><strong id="user-name">Cargando</strong
                ><small id="user-role"></small></span
              ><span aria-hidden="true">⌄</span>
            </button>
            <div id="account-menu" class="account-menu" hidden>
              <strong id="account-email"></strong
              ><button data-action="profile">Mi cuenta y seguridad</button
              ><button id="logout">Cerrar sesión ↗</button>
            </div>
          </div>
        </header>
        <main id="main" tabindex="-1">
          <div class="loading-screen" role="status">
            <span class="spinner"></span>
            <h1>Conectando</h1>
          </div>
        </main>
      </div>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <div>
          <span class="eyebrow" id="dialog-eyebrow" hidden></span>
          <h2 id="dialog-title"></h2>
        </div>
        <button class="icon-button" id="dialog-close" aria-label="Cerrar">
          ×
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <div class="toast-stack" id="toasts" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
